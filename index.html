<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livraria Folha Solta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Literata:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#EEF1F4; --painel:#FFFFFF; --tinta:#14202B; --suave:#5B6772; --linha:#D3DAE1;
  --azul:#2B4BDB; --amarelo:#F2C94C; --erro:#B3261E; --ok:#1F7A4D;
  --titulo:'Bricolage Grotesque',system-ui,sans-serif; --texto:'Literata',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--fundo:#0F161D; --painel:#18222C; --tinta:#E9EEF2; --suave:#9AA7B2; --linha:#2B3947; --azul:#7C93FF; --erro:#FF8A80; --ok:#6FD3A0;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--texto);line-height:1.6}
h1,h2,h3{font-family:var(--titulo);line-height:1.1;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem clamp(1rem,4vw,3rem);border-bottom:1px solid var(--linha);background:var(--painel);position:sticky;top:0;z-index:5}
.marca{font-family:var(--titulo);font-weight:800;font-size:1.4rem}
.btn{border:0;border-radius:8px;padding:.6rem 1rem;cursor:pointer;font-family:var(--titulo);font-weight:700;background:var(--azul);color:#fff}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linha)}
.btn.amarelo{background:var(--amarelo);color:#14202B}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero{padding:clamp(2rem,6vw,4.5rem) clamp(1rem,4vw,3rem) 1.5rem;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(2.4rem,7vw,5rem);font-weight:800;letter-spacing:-.03em;max-width:14ch}
.hero p{color:var(--suave);max-width:48ch;margin:1rem 0 0}
main{max-width:1200px;margin:auto;padding:0 clamp(1rem,4vw,3rem) 4rem;display:grid;grid-template-columns:1fr;gap:2.5rem}
@media(min-width:960px){main{grid-template-columns:1fr 320px;align-items:start}}
.filtros{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1.25rem}
.filtros input,.filtros select,form input,form select{padding:.6rem .8rem;border:1.5px solid var(--linha);border-radius:8px;background:var(--painel);width:100%}
.filtros input{flex:1 1 220px;width:auto}
.filtros select{flex:0 1 180px;width:auto}
.estante{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.25rem}
.livro{background:var(--painel);border:1px solid var(--linha);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.capa{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;padding:1rem;color:#fff;border-left:10px solid rgba(0,0,0,.25)}
.capa strong{font-family:var(--titulo);font-size:1.25rem;line-height:1.1}
.capa span{font-size:.8rem;opacity:.9}
.info{padding:.8rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.info small{color:var(--suave)}
.preco{font-family:var(--titulo);font-weight:800;font-size:1.2rem}
.info .btn{margin-top:auto}
.aside{background:var(--painel);border:1px solid var(--linha);border-radius:12px;padding:1.25rem}
.aside h2{font-size:1.4rem;margin-bottom:1rem}
form{display:grid;gap:.75rem}
label{font-size:.9rem;font-weight:600;display:grid;gap:.25rem}
.aviso{margin-top:.75rem;padding:.6rem .8rem;border-radius:8px;font-size:.92rem}
.aviso.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.aviso.erro{background:color-mix(in srgb,var(--erro) 15%,transparent);color:var(--erro)}
.vazio{padding:2rem;border:1.5px dashed var(--linha);border-radius:10px;color:var(--suave);grid-column:1/-1}
.gaveta{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--painel);border-left:1px solid var(--linha);padding:1.25rem;transform:translateX(100%);transition:transform .25s;z-index:10;display:flex;flex-direction:column;gap:1rem}
.gaveta.aberta{transform:none}
.gaveta ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;display:grid;gap:.75rem;align-content:start}
.gaveta li{display:grid;grid-template-columns:1fr auto;gap:.25rem .75rem;border-bottom:1px solid var(--linha);padding-bottom:.6rem}
.qtd{display:flex;gap:.4rem;align-items:center}
.qtd button{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--linha);background:transparent;cursor:pointer}
.total{display:flex;justify-content:space-between;font-family:var(--titulo);font-weight:800;font-size:1.3rem}
@media(prefers-reduced-motion:reduce){.gaveta{transition:none}}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">Livraria Folha Solta</div>
  <button class="btn amarelo" id="abrirSacola" aria-controls="sacola">Sacola (<span id="contador">0</span>)</button>
</header>

<section class="hero">
  <h1>Livros para a próxima página.</h1>
  <p>Busque pelo título, filtre por gênero e monte sua sacola. O catálogo vem direto do banco de dados da livraria.</p>
</section>

<main>
  <section aria-labelledby="tituloCatalogo">
    <h2 id="tituloCatalogo" style="margin-bottom:1rem">Catálogo</h2>
    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar por título ou autor" aria-label="Buscar livros">
      <select id="filtroGenero" aria-label="Filtrar por gênero"><option value="">Todos os gêneros</option></select>
    </div>
    <div class="estante" id="estante" aria-live="polite"></div>
  </section>

  <aside class="aside">
    <h2>Cadastrar livro</h2>
    <form id="formLivro">
      <label>Título <input name="titulo" required maxlength="120"></label>
      <label>Autor <input name="autor" required maxlength="80"></label>
      <label>Gênero
        <select name="genero" required>
          <option value="">Escolha</option>
          <option>Romance</option><option>Fantasia</option><option>Ficção científica</option>
          <option>Técnico</option><option>Infantil</option><option>Biografia</option>
        </select>
      </label>
      <label>Preço (R$) <input name="preco" type="number" step="0.01" min="0.01" required></label>
      <button class="btn" type="submit" id="btnSalvar">Cadastrar livro</button>
    </form>
    <div id="aviso" role="status"></div>
  </aside>
</main>

<aside class="gaveta" id="sacola" aria-label="Sacola de compras">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>Sua sacola</h2>
    <button class="btn sec" id="fecharSacola">Fechar</button>
  </div>
  <ul id="itens"></ul>
  <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
  <button class="btn" id="finalizar">Finalizar compra</button>
</aside>

<script>
// Endereço da sua API Flask. Se sua rota for outra, troque só aqui.
const API_URL = 'http://localhost:5000';
const ROTA = '/livros';

const CORES = {'Romance':'#B03A5B','Fantasia':'#5B3FA8','Ficção científica':'#0F6E8C','Técnico':'#2B4BDB','Infantil':'#D9822B','Biografia':'#3C7A4B'};
let livros = [];
let sacola = {}; // id -> quantidade

const $ = id => document.getElementById(id);
const moeda = v => Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- GET: listar ----------
async function listarLivros() {
  const resposta = await fetch(API_URL + ROTA);
  if (!resposta.ok) throw new Error('A API respondeu com status ' + resposta.status);
  return await resposta.json();
}

async function carregarLivros() {
  try {
    livros = await listarLivros();
    atualizarGeneros();
    renderizarEstante();
  } catch (erro) {
    $('estante').innerHTML = `<div class="vazio">Não foi possível carregar o catálogo. Confira se a API Flask está rodando em ${esc(API_URL)} e se o CORS está ativado.<br><small>${esc(erro.message)}</small></div>`;
  }
}

// ---------- POST: cadastrar ----------
async function cadastrarLivro(dados) {
  const resposta = await fetch(API_URL + ROTA, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dados),
  });
  const corpo = await resposta.json().catch(() => ({}));
  if (!resposta.ok) throw new Error(corpo.erro || corpo.mensagem || 'Erro ' + resposta.status);
  return corpo;
}

function mostrarAviso(texto, tipo) {
  $('aviso').innerHTML = `<div class="aviso ${tipo}">${esc(texto)}</div>`;
}

$('formLivro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const dados = {
    titulo: f.titulo.value.trim(),
    autor: f.autor.value.trim(),
    genero: f.genero.value,
    preco: parseFloat(f.preco.value),
  };
  $('btnSalvar').disabled = true;
  try {
    await cadastrarLivro(dados);
    mostrarAviso(`"${dados.titulo}" foi cadastrado e já está no catálogo.`, 'ok');
    f.reset();
    await carregarLivros(); // atualiza a lista sem recarregar a página
  } catch (erro) {
    mostrarAviso('Não foi possível cadastrar: ' + erro.message, 'erro');
  } finally {
    $('btnSalvar').disabled = false;
  }
});

// ---------- Catálogo ----------
function atualizarGeneros() {
  const select = $('filtroGenero');
  const atual = select.value;
  const generos = [...new Set(livros.map(l => l.genero).filter(Boolean))].sort();
  select.innerHTML = '<option value="">Todos os gêneros</option>' + generos.map(g => `<option>${esc(g)}</option>`).join('');
  select.value = generos.includes(atual) ? atual : '';
}

function corDaCapa(genero) {
  if (CORES[genero]) return CORES[genero];
  let h = 0; for (const c of String(genero)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 45% 35%)`;
}

function renderizarEstante() {
  const termo = $('busca').value.toLowerCase().trim();
  const genero = $('filtroGenero').value;
  const lista = livros.filter(l =>
    (!genero || l.genero === genero) &&
    (!termo || `${l.titulo} ${l.autor}`.toLowerCase().includes(termo)));

  if (!lista.length) {
    $('estante').innerHTML = `<div class="vazio">${livros.length ? 'Nenhum livro combina com essa busca. Tente outro termo ou gênero.' : 'O catálogo está vazio. Cadastre o primeiro livro no formulário.'}</div>`;
    return;
  }
  $('estante').innerHTML = lista.map(l => `
    <article class="livro">
      <div class="capa" style="background:${corDaCapa(l.genero)}">
        <strong>${esc(l.titulo)}</strong><span>${esc(l.autor)}</span>
      </div>
      <div class="info">
        <small>${esc(l.genero)}</small>
        <span class="preco">${moeda(l.preco)}</span>
        <button class="btn" data-add="${esc(l.id)}">Adicionar à sacola</button>
      </div>
    </article>`).join('');
}

$('busca').addEventListener('input', renderizarEstante);
$('filtroGenero').addEventListener('change', renderizarEstante);
$('estante').addEventListener('click', e => {
  const id = e.target.dataset.add;
  if (id === undefined) return;
  sacola[id] = (sacola[id] || 0) + 1;
  renderizarSacola();
});

// ---------- Sacola ----------
function renderizarSacola() {
  const ids = Object.keys(sacola).filter(id => livros.some(l => String(l.id) === id));
  let total = 0, qtdTotal = 0;
  $('itens').innerHTML = ids.length ? ids.map(id => {
    const l = livros.find(x => String(x.id) === id);
    const q = sacola[id];
    total += l.preco * q; qtdTotal += q;
    return `<li><div><strong>${esc(l.titulo)}</strong><br><small>${moeda(l.preco)}</small></div>
      <div class="qtd"><button data-menos="${esc(id)}" aria-label="Diminuir">−</button><span>${q}</span><button data-mais="${esc(id)}" aria-label="Aumentar">+</button></div></li>`;
  }).join('') : '<li style="color:var(--suave)">Sua sacola está vazia. Adicione um livro do catálogo.</li>';
  $('total').textContent = moeda(total);
  $('contador').textContent = qtdTotal;
  $('finalizar').disabled = !ids.length;
}

$('itens').addEventListener('click', e => {
  const mais = e.target.dataset.mais, menos = e.target.dataset.menos;
  if (mais !== undefined) sacola[mais]++;
  if (menos !== undefined && --sacola[menos] <= 0) delete sacola[menos];
  renderizarSacola();
});
$('finalizar').addEventListener('click', () => {
  alert('Compra finalizada! (simulação: nada é salvo no banco)');
  sacola = {}; renderizarSacola(); $('sacola').classList.remove('aberta');
});
$('abrirSacola').addEventListener('click', () => { renderizarSacola(); $('sacola').classList.add('aberta'); });
$('fecharSacola').addEventListener('click', () => $('sacola').classList.remove('aberta'));

carregarLivros().then(renderizarSacola);
</script>
</body>
</html>
